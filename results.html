<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GPL 4.1 Tournament Results</title><link rel="stylesheet" href="style.css"><style>
.result-card{margin-top:20px;border:2px solid #003366;border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.18)}.result-head{background:#003366;color:#fff;padding:14px;text-align:center;font-size:22px;font-weight:bold}.result-body{padding:16px}.result-row{padding:11px 0;border-bottom:1px solid #e1e1e1}.result-row:last-child{border-bottom:none}.winner{color:#155724;font-weight:bold}
</style></head><body><div class="container"><div class="header"><img class="page-logo" src="gpl-logo.png" alt="GPL 4.1 - Gully Premiere League"> GPL 4.1 Tournament Results</div><div class="form-box"><div id="results">Loading results...</div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import { getFirestore,collection,getDocs } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAQNpTgcKqYleL61DopRwz5LchN02jWQXI",authDomain:"update-7ac29.firebaseapp.com",projectId:"update-7ac29",storageBucket:"update-7ac29.firebasestorage.app",messagingSenderId:"806100858706",appId:"1:806100858706:web:b74e017b95ce223009ec8b"};
const db=getFirestore(initializeApp(cfg,'resultsPage'));const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
async function load(){const el=document.getElementById('results');try{const snap=await getDocs(collection(db,'matches'));const rows=[];snap.forEach(ds=>{const m=ds.data();if(String(m.status||'').toLowerCase()==='finished')rows.push(m);});rows.sort((a,b)=>String(b.time||'').localeCompare(String(a.time||'')));if(!rows.length){el.innerHTML='<p>No tournament results yet.</p>';return;}el.innerHTML=rows.map(m=>`<div class="result-card"><div class="result-head">${esc(m.team1)} vs ${esc(m.team2)}</div><div class="result-body"><div class="result-row"><b>${esc(m.team1)}</b>: ${esc(m.score1||'N/A')}</div><div class="result-row"><b>${esc(m.team2)}</b>: ${esc(m.score2||'N/A')}</div><div class="result-row">${m.result ? `<span class="winner">${esc(m.result)}</span>` : 'Result recorded'}</div><div class="result-row">Match Time: ${esc(m.time||'')}</div></div></div>`).join('');}catch(e){console.error(e);el.innerHTML='Error loading results.';}}
load();setInterval(load,30000);
</script></body></html>
