<!DOCTYPE html>
<html>
<head>
    <!-- html2pdf.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <title>View Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="header">View Your Registration</div>

    <div class="form-box">
        <label>GPL ID</label>
        <input id="gplid">

        <label>Full Name</label>
        <input id="name">

        <label>Father Name</label>
        <input id="father">

        <button onclick="search()">View Details</button>

        <div id="result"></div>
    </div>
</div>
<!-- ID Card Display Container -->
<div id="idCardWrapper" style="display: none;">
  <div id="idCard" style="border: 2px solid #333; padding: 20px; width: 300px; background: #fff; border-radius: 8px; margin: 20px auto;">
    <!-- Dynamic user details populate here -->
  </div>

  <div style="text-align: center;">
    <button id="downloadBtn" onclick="downloadIDCard()">Download ID Card (PDF)</button>
  </div>
</div>

<script type="module" src="view.js"></script>
</body>
</html>
