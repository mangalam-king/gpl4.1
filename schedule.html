<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GPL 4.1 Schedule</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>.match-card{margin-top:16px;border:2px solid #003366;border-radius:8px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.12);padding:16px}.match-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#666;font-size:.9rem}.teams{font-size:1.2rem;font-weight:700;color:#003366;text-align:center;margin:12px 0}.meta{text-align:center;color:#555;margin:5px 0}.badge{display:inline-block;padding:3px 9px;border-radius:12px;color:#fff;font-weight:700;font-size:.78rem}.up{background:#0056b3}.live{background:#dc3545}.done{background:#28a745}.empty{color:#666;padding:12px 0}.quick-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.quick-links a{padding:8px 12px;border-radius:5px;background:#003366;color:#fff;text-decoration:none;font-weight:600}</style></head>
<body><div class="container"><div class="header"><img class="page-logo" src="gpl-logo.png" alt="GPL 4.1 - Gully Premiere League"> GPL 4.1 Match Schedule</div><div class="form-box"><div class="quick-links"><a href="scoreboard.html">Live Scoreboard</a><a href="teams.html">Teams</a><a href="points.html">Points Table</a><a href="results.html">Results</a><a href="index.html">Home</a></div><h3 id="upcoming"><i class="fa-solid fa-calendar-days"></i> Upcoming Matches</h3><div id="upcoming-list">Loading...</div><hr style="margin:25px 0"><h3><i class="fa-solid fa-list"></i> Full Schedule</h3><div id="all-list">Loading...</div></div></div>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import{getFirestore,collection,onSnapshot}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";const cfg={apiKey:"AIzaSyAQNpTgcKqYleL61DopRwz5LchN02jWQXI",authDomain:"update-7ac29.firebaseapp.com",projectId:"update-7ac29",storageBucket:"update-7ac29.firebasestorage.app",messagingSenderId:"806100858706",appId:"1:806100858706:web:b74e017b95ce223009ec8b"};const db=getFirestore(initializeApp(cfg,'schedulePage'));const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');function card(m){let st=String(m.status||'Upcoming');let cls=st.toUpperCase()==='LIVE'?'live':st.toLowerCase()==='finished'?'done':'up';return `<div class="match-card"><div class="match-top"><span>${esc(m.time||'Date/time TBD')}</span><span class="badge ${cls}">${esc(st)}</span></div><div class="teams">${esc(m.team1||'Team 1')} <span style="font-weight:400">vs</span> ${esc(m.team2||'Team 2')}</div>${m.venue?`<div class="meta"><i class="fa-solid fa-location-dot"></i> ${esc(m.venue)}</div>`:''}${m.result?`<div class="meta"><b>${esc(m.result)}</b></div>`:''}${String(st).toLowerCase()==='finished'?`<div class="meta">${esc(m.score1||'-')} &nbsp; | &nbsp; ${esc(m.score2||'-')}</div>`:''}</div>`}function render(snap){let all=[];snap.forEach(d=>all.push(d.data()));all.sort((a,b)=>Number(a.timestamp||0)-Number(b.timestamp||0));let upcoming=all.filter(m=>String(m.status||'Upcoming').toLowerCase()==='upcoming');document.getElementById('upcoming-list').innerHTML=upcoming.length?upcoming.map(card).join(''):'<div class="empty">No upcoming matches scheduled.</div>';document.getElementById('all-list').innerHTML=all.length?all.map(card).join(''):'<div class="empty">No matches scheduled yet.</div>'}onSnapshot(collection(db,'matches'),render,()=>{document.getElementById('upcoming-list').innerHTML='<div class="empty">Unable to load schedule.</div>';document.getElementById('all-list').innerHTML='';});</script></body></html>
