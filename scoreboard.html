<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPL 4.1 Live Match Scoreboard</title><link rel="stylesheet" href="style.css">
<style>
.score-card{margin-top:20px;border:2px solid #003366;border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.score-head{background:#003366;color:#fff;padding:14px;text-align:center;font-size:22px;font-weight:bold}.score-body{padding:16px}.live{color:#dc3545;font-weight:bold}.score-line{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #e1e1e1}.score-line:last-child{border-bottom:none}.score-value{font-weight:bold;color:#003366}
.live-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}.live-box{border:1px solid #ddd;border-radius:6px;padding:10px;background:#fafafa}.live-box h4{margin:0 0 6px;color:#003366}.stat{display:flex;justify-content:space-between;padding:3px 0}.updated{font-size:.82rem;color:#666;margin-top:10px;text-align:right}
</style>
</head><body><div class="container"><div class="header"><img class="page-logo" src="gpl-logo.png" alt="GPL 4.1 - Gully Premiere League"> GPL 4.1 Live Match Scoreboard</div><div class="form-box"><div id="scoreboard">Loading scoreboard...</div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAQNpTgcqKYleL61DopRwz5LchN02jWQXI",authDomain:"update-7ac29.firebaseapp.com",projectId:"update-7ac29",storageBucket:"update-7ac29.firebasestorage.app",messagingSenderId:"806100858706",appId:"1:806100858706:web:b74e017b95ce223009ec8b"};
// Use the existing update/matches Firebase project. This page only reads match data.
const db=getFirestore(initializeApp(cfg,'scoreboardRealtime'));
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
function playerBox(title,name,runs,balls){if(!name)return '';return `<div class="live-box"><h4>${title}</h4><div><b>${esc(name)}</b></div><div class="stat"><span>Runs</span><b>${runs ?? '—'}</b></div><div class="stat"><span>Balls</span><b>${balls ?? '—'}</b></div></div>`;}
function bowlerBox(live){if(!live?.bowler)return '';return `<div class="live-box"><h4>Bowler</h4><div><b>${esc(live.bowler)}</b></div><div class="stat"><span>Overs</span><b>${esc(live.bowlerOvers || '—')}</b></div><div class="stat"><span>Runs</span><b>${live.bowlerRuns ?? '—'}</b></div><div class="stat"><span>Wickets</span><b>${live.bowlerWickets ?? '—'}</b></div></div>`;}
function render(snap){const el=document.getElementById('scoreboard');let rows=[];snap.forEach(ds=>{const m=ds.data();if(String(m.status||'').toUpperCase()==='LIVE') rows.push(m);});if(!rows.length){el.innerHTML='<p>No live match right now.</p>';return;}el.innerHTML=rows.map(m=>{const l=m.live||{};return `<div class="score-card"><div class="score-head"><span class="live">● LIVE</span> ${esc(m.team1)} vs ${esc(m.team2)}</div><div class="score-body"><div class="score-line"><span>${esc(m.team1)}</span><span class="score-value">${esc(m.score1||'N/A')}</span></div><div class="score-line"><span>${esc(m.team2)}</span><span class="score-value">${esc(m.score2||'N/A')}</span></div><div class="score-line"><span>Current Over</span><span class="score-value">${esc(l.over||'—')}</span></div>${(l.striker||l.nonstriker||l.bowler)?`<div class="live-grid">${playerBox('Striker / Batter',l.striker,l.strikerRuns,l.strikerBalls)}${playerBox('Non-Striker',l.nonstriker,l.nonstrikerRuns,l.nonstrikerBalls)}${bowlerBox(l)}</div>`:''}<div class="score-line"><span>Match Time</span><span>${esc(m.time||'')}</span></div><div class="score-line"><span>Update</span><span>${esc(m.result||'Live')}</span></div><div class="updated">Live updates are automatic.</div></div></div>`;}).join('');}
onSnapshot(collection(db,'matches'),render,err=>{console.error(err);document.getElementById('scoreboard').innerHTML='Error loading live scoreboard.';});
</script></body></html>
