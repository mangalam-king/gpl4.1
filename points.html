<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GPL 4.1 Points Table</title><link rel="stylesheet" href="style.css"><style>
.table-wrap{overflow-x:auto;margin-top:20px}.points-table{width:100%;border-collapse:collapse;background:#fff}.points-table th,.points-table td{border:1px solid #ccc;padding:9px;text-align:center}.points-table th{background:#003366;color:#fff}.points-table td:first-child,.points-table td:nth-child(2){text-align:left}.note{margin-top:12px;color:#666;font-size:.9rem}
</style></head><body><div class="container"><div class="header"><img class="page-logo" src="gpl-logo.png" alt="GPL 4.1 - Gully Premiere League"> GPL 4.1 Points Table</div><div class="form-box"><div class="table-wrap"><table class="points-table"><thead><tr><th>#</th><th>Team</th><th>MP</th><th>W</th><th>L</th><th>T</th><th>NR</th><th>Pts</th><th>NRR</th></tr></thead><tbody id="points-body"><tr><td colspan="9">Loading...</td></tr></tbody></table></div><div class="note">Points: win = 2, tie = 1, no result = 1. NRR is calculated from entered match scores and overs.</div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import { getFirestore,collection,onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAQNpTgcqYleL61DopRwz5LchN02jWQXI",authDomain:"update-7ac29.firebaseapp.com",projectId:"update-7ac29",storageBucket:"update-7ac29.firebasestorage.app",messagingSenderId:"806100858706",appId:"1:806100858706:web:b74e017b95ce223009ec8b"};const db=getFirestore(initializeApp(cfg,'pointsPage'));const teams=['Team A','Team B','Team C','Team D'];
function score(v){const m=String(v||'').match(/^\s*(\d+)\s*\/\s*(\d+)(?:\s*\((\d+(?:\.\d+)?)\))?/);return m?{runs:Number(m[1]),wickets:Number(m[2]),overs:m[3]?Number(m[3]):null}:null}
function oversFromScore(v){const x=score(v);return x&&x.overs>0?x.overs:null}
function load(snap){const body=document.getElementById('points-body');const stats={};teams.forEach(t=>stats[t]={team:t,mp:0,w:0,l:0,t:0,nr:0,pts:0,rf:0,of:0,ra:0,oa:0});snap.forEach(ds=>{const m=ds.data();if(String(m.status||'').toLowerCase()!=='finished')return;const a=m.team1,b=m.team2;if(!stats[a]||!stats[b])return;stats[a].mp++;stats[b].mp++;const x=score(m.score1),y=score(m.score2);if(x&&y){stats[a].rf+=x.runs;stats[a].ra+=y.runs;stats[b].rf+=y.runs;stats[b].ra+=x.runs;const xo=oversFromScore(m.score1),yo=oversFromScore(m.score2);if(xo){stats[a].of+=xo;stats[b].oa+=xo;}if(yo){stats[b].of+=yo;stats[a].oa+=yo;}}
if(x&&y&&x.runs!==y.runs){if(x.runs>y.runs){stats[a].w++;stats[b].l++;stats[a].pts+=2;}else{stats[b].w++;stats[a].l++;stats[b].pts+=2;}}else{const text=String(m.result||'').toLowerCase();if(/no result|abandoned/.test(text)){stats[a].nr++;stats[b].nr++;stats[a].pts++;stats[b].pts++;}else{stats[a].t++;stats[b].t++;stats[a].pts++;stats[b].pts++;}}});
const arr=Object.values(stats).map(x=>({...x,nrr:((x.of?x.rf/x.of:0)-(x.oa?x.ra/x.oa:0))})).sort((a,b)=>b.pts-a.pts||b.nrr-a.nrr||b.w-a.w||a.l-b.l);body.innerHTML=arr.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.team}</b></td><td>${x.mp}</td><td>${x.w}</td><td>${x.l}</td><td>${x.t}</td><td>${x.nr}</td><td><b>${x.pts}</b></td><td>${x.nrr.toFixed(3)}</td></tr>`).join('');}
onSnapshot(collection(db,'matches'),load,err=>{console.error(err);document.getElementById('points-body').innerHTML='<tr><td colspan="9">Error loading points table.</td></tr>';});
</script></body></html>
