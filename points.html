<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GPL 4.1 Points Table</title><link rel="stylesheet" href="style.css"><style>
.table-wrap{overflow-x:auto;margin-top:20px}.points-table{width:100%;border-collapse:collapse;background:#fff}.points-table th,.points-table td{border:1px solid #ccc;padding:9px;text-align:center}.points-table th{background:#003366;color:#fff}.points-table td:first-child,.points-table td:nth-child(2){text-align:left}.note{margin-top:12px;color:#666;font-size:.9rem}
</style></head><body><div class="container"><div class="header"><img class="page-logo" src="gpl-logo.png" alt="GPL 4.1 - Gully Premiere League"> GPL 4.1 Points Table</div><div class="form-box"><div class="table-wrap"><table class="points-table"><thead><tr><th>#</th><th>Team</th><th>MP</th><th>W</th><th>L</th><th>T</th><th>NR</th><th>Pts</th></tr></thead><tbody id="points-body"><tr><td colspan="8">Loading...</td></tr></tbody></table></div><div class="note">Points are calculated from existing finished match scores: win = 2, tie = 1, no result = 1.</div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import { getFirestore,collection,getDocs } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAQNpTgcKqYleL61DopRwz5LchN02jWQXI",authDomain:"update-7ac29.firebaseapp.com",projectId:"update-7ac29",storageBucket:"update-7ac29.firebasestorage.app",messagingSenderId:"806100858706",appId:"1:806100858706:web:b74e017b95ce223009ec8b"};const db=getFirestore(initializeApp(cfg,'pointsPage'));const teams=['Team A','Team B','Team C','Team D'];
function runs(v){const m=String(v||'').match(/^\s*(\d+)/);return m?Number(m[1]):null}
async function load(){const body=document.getElementById('points-body');const stats={};teams.forEach(t=>stats[t]={team:t,mp:0,w:0,l:0,t:0,nr:0,pts:0});try{const snap=await getDocs(collection(db,'matches'));snap.forEach(ds=>{const m=ds.data();if(String(m.status||'').toLowerCase()!=='finished')return;const a=m.team1,b=m.team2;if(!stats[a]||!stats[b])return;stats[a].mp++;stats[b].mp++;const r1=runs(m.score1),r2=runs(m.score2);if(r1===null||r2===null){const text=String(m.result||'').toLowerCase();if(/no result|abandoned/.test(text)){stats[a].nr++;stats[b].nr++;stats[a].pts++;stats[b].pts++;}else if(/tie|tied/.test(text)){stats[a].t++;stats[b].t++;stats[a].pts++;stats[b].pts++;}return;}if(r1===r2){stats[a].t++;stats[b].t++;stats[a].pts++;stats[b].pts++;}else if(r1>r2){stats[a].w++;stats[b].l++;stats[a].pts+=2;}else{stats[b].w++;stats[a].l++;stats[b].pts+=2;}});const arr=Object.values(stats).sort((a,b)=>b.pts-a.pts||b.w-a.w||a.l-b.l);body.innerHTML=arr.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.team}</b></td><td>${x.mp}</td><td>${x.w}</td><td>${x.l}</td><td>${x.t}</td><td>${x.nr}</td><td><b>${x.pts}</b></td></tr>`).join('');}catch(e){console.error(e);body.innerHTML='<tr><td colspan="8">Error loading points table.</td></tr>';}}
load();setInterval(load,30000);
</script></body></html>
